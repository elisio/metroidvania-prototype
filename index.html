<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060b">
  <title>Noite de Ferro</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #05060b; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #game { display: block; background: #05060b; outline: none; image-rendering: auto; }
    #noscript { color: #ccc; font: 16px Georgia, serif; }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" tabindex="0" aria-label="Noite de Ferro — jogo"></canvas>
  <noscript><p id="noscript">Noite de Ferro precisa de JavaScript.</p></noscript>

  <!-- Scripts clássicos (sem ES modules) para funcionar via file:// -->
  <script src="src/config.js"></script>
  <script src="src/core/util.js"></script>
  <script src="src/core/input.js"></script>
  <script src="src/core/screen.js"></script>
  <script src="src/core/assets.js"></script>
  <script src="src/core/camera.js"></script>
  <script src="src/audio/audio.js" onerror="this.remove()"></script>
  <script src="src/data/rooms.js"></script>
  <script src="src/data/text.js"></script>
  <script src="src/world/world.js"></script>
  <script src="src/world/textures.js"></script>
  <script src="src/world/terrain.js"></script>
  <script src="src/systems/fx.js"></script>
  <script src="src/systems/save.js"></script>
  <script src="src/systems/map.js"></script>
  <script src="src/entities/player.js"></script>
  <script src="src/entities/objects.js"></script>
  <script src="src/ui/hud.js"></script>
  <script src="src/ui/screens.js"></script>
  <script src="src/ui/touch.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
